[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphrag-service"
version = "0.1.0"
description = "GraphRAG vs vector RAG with LlamaIndex and LangChain, pluggable Pinecone/Bedrock/Azure OpenAI adapters, an eval harness and tracing hooks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Md Tanvir Alam" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy>=1.26",
  "networkx>=3.3",
  "llama-index-core>=0.12",
  "langchain-core>=0.3",
  "openai>=1.50",
  "boto3>=1.35",
  "pinecone>=5.0",
  "langfuse>=3.0",
  "langsmith>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
graphrag = "graphrag_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
